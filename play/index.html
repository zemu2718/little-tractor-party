<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d5ecdf"><meta name="description" content="齐齐的小龙游乐园：农场伙伴、成长相册和生日蛋糕，专为手机横屏与大屏展示准备。"><title>小龙游乐园 · 齐齐两岁快乐</title><link rel="icon" href="../assets/little-dragon.png" type="image/png"><link rel="stylesheet" href="play.css"><script src="audio.js" defer></script><script src="play.js" defer></script><link rel="stylesheet" href="../assets/scenes.css"></head>
<body>
<main id="stage" tabindex="-1" aria-label="齐齐的小龙游乐园">
<section id="scene-home" class="scene" aria-label="快乐农场"><img class="scene-art" src="../assets/play-family-final.png" alt="公鸡爸爸、鼠妈妈和小龙齐齐的生日小世界" width="1671" height="941" decoding="async"><h1 class="birthday-heading"><img class="title-art" src="../assets/birthday-title.png" alt="齐齐，2岁生日快乐！" width="2172" height="724"></h1><p class="scene-note">爸爸开车，妈妈陪伴，齐齐快乐长大。</p></section>
<section id="scene-album" class="scene" hidden aria-label="成长相册">
<div class="album-bg"></div><div id="album-empty" class="empty"><img src="../assets/little-dragon.png" alt="小龙等你一起看照片"><h1>小小的你，大大的快乐</h1><p>选一些照片，一起看看齐齐的成长吧。</p><button class="primary" id="empty-pick">选择成长照片</button></div>
<figure id="photo-frame" hidden><img id="photo-img" alt=""><figcaption id="photo-caption"></figcaption></figure><div id="album-count" class="album-count" hidden></div><div id="album-progress" hidden><i></i></div>
</section>
<section id="scene-cake" class="scene generated-scene" hidden aria-label="生日蛋糕">
<div id="birthday-cake"><img class="scene-art" src="../assets/cake-family.png" alt="公鸡爸爸、鼠妈妈和小龙齐齐的生日小世界" width="1671" height="941" decoding="async"><img  class="flame-layer" src="../assets/candle-flame.png" alt="" aria-hidden="true"></div><h1 class="birthday-heading"><img class="title-art" src="../assets/birthday-title.png" alt="齐齐，2岁生日快乐！" width="2172" height="724"></h1>
<h2 id="cake-title" class="sr-only" aria-live="polite">齐齐，生日快乐！</h2><p id="lyric" class="scene-note" aria-live="polite">许一个小小的愿望吧</p>
</section>
<section id="scene-game" class="scene" hidden aria-label="和生肖家人玩">
<div class="scene-heading"><p>没有输赢，每一次发现都很棒</p><h1>我们一家，一起玩！</h1><div id="hello" aria-live="polite">轻轻点一下，看看谁来打招呼</div></div>
<div class="friends"><button data-friend="dragon" aria-label="和小龙打招呼"><img src="../assets/little-dragon.png" alt=""><span>小龙齐齐</span></button><button data-friend="mouse" aria-label="和鼠妈妈打招呼"><img src="../assets/little-mouse.png" alt=""><span>鼠妈妈</span></button><button data-friend="rooster" aria-label="和公鸡爸爸打招呼"><img src="../assets/little-rooster.png" alt=""><span>公鸡爸爸</span></button><button data-friend="tractor" aria-label="和拖拉机打招呼"><img src="../assets/red-tractor.png" alt=""><span>拖拉机</span></button></div>
<div id="bubbles" aria-hidden="true"></div>
</section><div id="confetti" aria-hidden="true"></div>
</main>
<p class="portrait-note">把手机横过来，和小龙一起出发<br>可使用手机的屏幕镜像连接电视</p>
<nav id="controls" aria-label="游乐园控制">
<div class="row tabs" aria-label="选择场景"><button data-scene="home" aria-pressed="true">快乐农场</button><button data-scene="album" aria-pressed="false">成长相册</button><button data-scene="cake" aria-pressed="false">生日蛋糕</button><button data-scene="game" aria-pressed="false">点点玩</button></div>
<div class="row" id="album-tools" hidden><button id="pick">选择照片</button><button id="previous" disabled aria-label="上一张照片">← 上一张</button><button id="album-toggle" disabled>播放相册</button><button id="next" disabled aria-label="下一张照片">下一张 →</button></div>
<div class="row" id="cake-tools" hidden><button id="sing">♫ 一起唱生日歌</button><button id="blow">吹灭蜡烛</button><button id="relight" hidden>重新点亮</button></div>
<div class="row"><button id="sound" aria-pressed="false">声音：关</button><button id="photo" aria-pressed="false">合影模式</button><button id="hide">隐藏按钮</button></div>
<details id="settings"><summary>更多设置与版本</summary>
<div class="row"><button id="pause" aria-pressed="false">暂停动画</button><button id="fullscreen">全屏展示</button><button id="awake" aria-pressed="false">保持屏幕常亮</button><a href="../assets/play-preview-4k.png" download="齐齐小龙游乐园-4K.png">农场备用图</a><button id="choose-version">选择其他版本</button></div>
<div class="row album-settings" id="album-settings" hidden><label>每张停留 <select id="duration"><option value="5">5 秒</option><option value="8" selected>8 秒</option><option value="12">12 秒</option></select></label><button id="pick-music">选择背景音乐</button><button id="music-toggle" disabled>播放音乐</button><button id="clear-photos" disabled>清空照片</button><button id="pick-folder">选择文件夹</button><label><input id="captions" type="checkbox" checked>显示文件名字幕</label></div>
<div class="row" id="mic-tools" hidden><button id="mic-toggle" aria-pressed="false">开启吹气感应</button><span id="mic-status" role="status"></span></div>
<p class="help">隐藏后轻点空白处恢复操作；Esc 恢复，1–4 切换场景。<br>照片只在本机展示，刷新或切换版本后需重选。声音默认关闭。</p>
</details>
</nav>
<input id="files" type="file" multiple accept="image/*" hidden><input id="folder" type="file" multiple webkitdirectory hidden><input id="music-file" type="file" accept="audio/*" hidden><audio id="bgm" loop preload="metadata"></audio>
<div id="notice" role="status" aria-live="polite"></div>
<dialog id="leave-dialog"><h2>换一个生日小世界？</h2><p>已选照片和音乐不会带到其他版本，回来后需要重选。全屏和常亮也可能需要重新开启。</p><div class="row"><button id="stay">继续玩</button><a class="primary" href="../index.html">返回版本首页</a></div></dialog>
<noscript><p class="noscript">启用 JavaScript 后可切换相册、蛋糕和小游戏。<a href="../index.html">返回版本首页</a></p></noscript>
</body></html>
