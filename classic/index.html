<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f1df">
<title>清新简洁 · 齐齐两岁生日</title>
<meta name="description" content="齐齐两岁生日大屏：快乐农场、生日蛋糕、合影模式。">
<style>
:root { color-scheme:light; --ink:#315548; --paper:#f8f1df; }
* { box-sizing:border-box; }
html,body { margin:0; width:100%; height:100%; overflow:hidden; }
body { background:#e7e6d6; color:var(--ink); font-family:"PingFang SC","Microsoft YaHei",sans-serif; display:grid; place-items:center; }
button,a,summary { font:inherit; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
button[hidden],.controls[hidden] { display:none!important; }
.stage { position:relative; width:min(100vw,177.7778vh); width:min(100vw,177.7778dvh); aspect-ratio:16/9; overflow:hidden; background:var(--paper); isolation:isolate; outline:none; }
.scene { position:absolute; inset:0; width:100%; height:100%; }
.controls { position:fixed; bottom:max(12px,env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); width:max-content; max-width:calc(100vw - 24px); max-height:70vh; max-height:70dvh; overflow-y:auto; z-index:5; padding:8px; background:#fff9e9f5; border:1px solid #31554820; border-radius:22px; box-shadow:0 4px 20px #31554815; }
.control-row { display:flex; flex-wrap:wrap; justify-content:center; gap:5px; max-width:680px; }
.controls button,.controls a { display:inline-flex; align-items:center; justify-content:center; min-height:44px; border:0; border-radius:18px; padding:10px 14px; background:transparent; color:var(--ink); cursor:pointer; font-size:13px; text-decoration:none; }
.controls button:hover,.controls a:hover,summary:hover { background:#e9edda; }
.controls button[aria-pressed="true"] { background:#315548; color:#fff9e9; }
#candles { background:#edce8d; }
.controls :focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
.controls button:disabled { cursor:wait; opacity:.65; }
summary { cursor:pointer; text-align:center; padding:10px; border-radius:12px; font-size:12px; color:#6c7d61; min-height:38px; }
.secondary { border-top:1px solid #31554815; padding-top:8px; }
.help { max-width:650px; font-size:12px; line-height:1.8; margin:8px 12px; text-align:center; color:#6c7d61; }
.notice { position:fixed; left:50%; top:max(12px,env(safe-area-inset-top)); transform:translateX(-50%); background:#315548ed; color:#fff9e9; padding:12px 20px; border-radius:18px; text-align:center; font-size:13px; line-height:1.6; z-index:6; max-width:90vw; width:max-content; pointer-events:none; }
.notice:empty { display:none; }
.portrait-note { display:none; position:fixed; top:calc(50% + 28.125vw); font-size:13px; color:#63715d; text-align:center; line-height:1.8; margin:20px; }
.clean .portrait-note { display:none; }








.paused * { animation-play-state:paused!important; }
#confetti { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.confetti-piece { position:absolute; left:var(--x); top:-5%; width:.55%; height:1.6%; border-radius:2px; background:var(--color); opacity:0; animation:fall var(--duration) linear var(--delay) both; }
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes drift { to { transform:translateX(28px); } }
@keyframes sway { from { transform:rotate(-2deg); } to { transform:rotate(3deg); } }
@keyframes fall { 0% { opacity:0; transform:translate(0,0) rotate(0); } 8% { opacity:.8; } 85% { opacity:.8; } 100% { opacity:0; transform:translate(var(--drift),var(--fall)) rotate(var(--turn)); } }
@media(prefers-reduced-motion:reduce) { .stage * { animation:none!important; } #confetti { display:none; } }
@media(orientation:portrait) { .portrait-note { display:block; } .controls { width:calc(100vw - 24px); } .controls button,.controls a { padding:10px 12px; } }
@media(max-height:460px) { .controls { bottom:max(6px,env(safe-area-inset-bottom)); padding:4px; border-radius:16px; } .controls button,.controls a { padding:8px 12px; font-size:12px; } summary { padding:6px; min-height:30px; } }

[hidden] { display:none!important; }

@keyframes ride { from {transform:translateX(-14px)} to {transform:translateX(14px)} }
#flames { transform-box:fill-box; transform-origin:center bottom; }
.controls button,.controls a { min-height:44px; }
@media(prefers-reduced-motion:reduce) { .stage * { animation:none!important; } }
</style>
<link rel="stylesheet" href="../assets/scenes.css">
<link rel="icon" href="../assets/little-dragon.png" type="image/png">
</head>
<body>
<main class="stage" id="stage" tabindex="-1" aria-label="齐齐两周岁生日农场，公鸡爸爸开拖拉机，鼠妈妈和小龙齐齐坐在拖斗里">
<section id="farm-scene" class="scene generated-scene" aria-label="公鸡爸爸开拖拉机，鼠妈妈陪小龙齐齐过生日"><img class="scene-art" src="../assets/classic-family-final.png" alt="公鸡爸爸、鼠妈妈和小龙齐齐的生日小世界" width="1671" height="941" decoding="async"><h1 class="birthday-heading"><img class="title-art" src="../assets/birthday-title.png" alt="齐齐，2岁生日快乐！" width="2172" height="724"></h1><p class="scene-note">爸爸开车，妈妈陪伴，齐齐快乐长大。</p></section>
<section id="cake-scene" class="scene generated-scene" style="display:none" aria-label="一家三口为齐齐庆祝两岁生日"><img class="scene-art" src="../assets/cake-family.png" alt="公鸡爸爸、鼠妈妈和小龙齐齐的生日小世界" width="1671" height="941" decoding="async"><h1 class="birthday-heading"><img class="title-art" src="../assets/birthday-title.png" alt="齐齐，2岁生日快乐！" width="2172" height="724"></h1><img id="flames" class="flame-layer" src="../assets/candle-flame.png" alt="" aria-hidden="true"><p id="cake-wish" class="scene-note" aria-live="polite">小小的愿望，大大的幸福。</p></section>
<div id="confetti" aria-hidden="true"></div>
</main>
<p class="portrait-note">把手机横过来，让快乐铺满大屏<br>通过手机的屏幕镜像功能投到电视</p>
<nav class="controls" id="controls" aria-label="大屏控制">
 <div class="control-row">
  <button id="farm" type="button" aria-pressed="true">快乐农场</button>
  <button id="cake" type="button" aria-pressed="false">生日蛋糕</button>
  <button id="candles" type="button" hidden>吹灭蜡烛</button>
  <button id="photo" type="button" aria-pressed="false">合影模式</button>
  <button id="celebrate" type="button">撒花庆祝</button>
  <button id="hide" type="button">隐藏按钮</button>
 </div>
 <details id="options"><summary>更多设置与备用图</summary>
  <div class="control-row secondary">
   <button id="pause" type="button" aria-pressed="false">暂停动画</button>
   <button id="fullscreen" type="button">全屏展示</button>
   <button id="awake" type="button" aria-pressed="false">保持屏幕常亮</button>
   <a href="assets/birthday-background-4k.png" download="齐齐两岁生日背景-4K.png">农场备用图</a>
   <a href="assets/birthday-cake-4k.png" download="齐齐两岁生日蛋糕-4K.png">蛋糕备用图</a>
  </div>
  <a href="../index.html">选择其他版本</a>
  <p class="help">先横屏，再使用手机屏幕镜像。隐藏后轻点画面恢复操作。<br>蛋糕和蜡烛由大人手动控制；没有倒计时，也不会调用麦克风。<br>常亮功能不可用时，请在手机设置里暂时延长自动锁屏时间。</p>
 </details>
</nav>
<div class="notice" id="notice" role="status" aria-live="polite"></div>
<noscript><p class="notice">当前为静态农场背景；开启浏览器 JavaScript 后可切换蛋糕和合影模式。</p></noscript>
<script>
'use strict';
const $ = id => document.getElementById(id);
const stage = $('stage');
const controls = $('controls');
const pause = $('pause');
const photo = $('photo');
const notice = $('notice');
const fullscreen = $('fullscreen');
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
let scene = 'farm';
let blown = false;
let photoMode = false;
let pausedBeforePhoto = false;
let noticeTimer;
let confettiTimer;
let wakeLock = null;
let wantsAwake = false;
let wakePending = false;

function clearNotice() {
 clearTimeout(noticeTimer);
 notice.textContent = '';
}
function tell(message) {
 clearNotice();
 notice.textContent = message;
 noticeTimer = setTimeout(clearNotice, 5000);
}
function setControls(visible) {
 controls.hidden = !visible;
 document.body.classList.toggle('clean', !visible || photoMode);
 if (!visible) {
  $('options').open = false;
  clearNotice();
  stage.focus({preventScroll:true});
 }
}
function setPaused(paused) {
 stage.classList.toggle('paused', paused);
 pause.textContent = paused ? '继续动画' : '暂停动画';
 pause.setAttribute('aria-pressed', String(paused));
 if (paused) clearConfetti();
}
function leavePhoto() {
 photoMode = false;
 photo.textContent = '合影模式';
 photo.setAttribute('aria-pressed', 'false');
 document.body.classList.toggle('clean', controls.hidden);
 setPaused(pausedBeforePhoto);
}
photo.addEventListener('click', () => {
 if (photoMode) { leavePhoto(); return; }
 pausedBeforePhoto = stage.classList.contains('paused');
 photoMode = true;
 setPaused(true);
 photo.textContent = '退出合影';
 photo.setAttribute('aria-pressed', 'true');
 setControls(false);
});
pause.addEventListener('click', () => {
 if (photoMode) { leavePhoto(); setPaused(false); }
 else setPaused(!stage.classList.contains('paused'));
});
function clearConfetti() {
 clearTimeout(confettiTimer);
 $('confetti').replaceChildren();
}
function celebrate() {
 clearConfetti();
 if (reducedMotion.matches || stage.classList.contains('paused')) return;
 const colors = ['#cda45a','#829769','#d69573','#e4c46c'];
 const pieces = document.createDocumentFragment();
 for (let i=0; i<48; i++) {
  const piece = document.createElement('i');
  piece.className = 'confetti-piece';
  const values = {
   '--x':`${(i * 37) % 100}%`, '--color':colors[i % colors.length],
   '--duration':`${6 + (i % 4) * .5}s`, '--delay':`${(i % 7) * .13}s`,
   '--drift':`${(i % 2 ? 1 : -1) * (15 + i % 60)}px`,
   '--fall':`${stage.clientHeight * 1.12}px`, '--turn':`${i % 2 ? 240 : -240}deg`
  };
  for (const [key,value] of Object.entries(values)) piece.style.setProperty(key,value);
  pieces.append(piece);
 }
 $('confetti').append(pieces);
 confettiTimer = setTimeout(clearConfetti, 9000);
}
function updateCandles() {
 $('flames').style.display = blown ? 'none' : '';
 $('cake-wish').textContent = blown ? '愿所有美好，陪你慢慢长大。' : '小小的愿望，大大的幸福。';
 $('candles').textContent = blown ? '重新点亮' : '吹灭蜡烛';
 stage.setAttribute('aria-label', scene === 'farm'
  ? '齐齐两周岁生日农场，公鸡爸爸开拖拉机，鼠妈妈和小龙齐齐坐在拖斗里'
  : `齐齐两周岁生日蛋糕，蜡烛${blown ? '已熄灭' : '已点亮'}`);
}
function selectScene(next) {
 if (scene === next) return;
 clearConfetti();
 clearNotice();
 scene = next;
 $('farm-scene').style.display = next === 'farm' ? '' : 'none';
 $('cake-scene').style.display = next === 'cake' ? '' : 'none';
 $('farm').setAttribute('aria-pressed', String(next === 'farm'));
 $('cake').setAttribute('aria-pressed', String(next === 'cake'));
 $('candles').hidden = next !== 'cake';
 updateCandles();
}
$('farm').addEventListener('click', () => selectScene('farm'));
$('cake').addEventListener('click', () => selectScene('cake'));
$('candles').addEventListener('click', () => {
 if (scene !== 'cake') return;
 blown = !blown;
 updateCandles();
 if (blown) { celebrate(); setControls(false); }
 else clearConfetti();
});
$('celebrate').addEventListener('click', () => { celebrate(); setControls(false); });
$('hide').addEventListener('click', () => setControls(false));
document.addEventListener('click', event => {
 if (controls.hidden && !event.target.closest('button,a,summary')) setControls(true);
});
fullscreen.addEventListener('click', async () => {
 try {
  if (document.fullscreenElement) await document.exitFullscreen();
  else if (document.documentElement.requestFullscreen) {
   await document.documentElement.requestFullscreen();
   setControls(false);
  } else tell('此浏览器不支持网页全屏，请横屏并收起浏览器工具栏。');
 } catch { tell('暂时无法进入全屏；仍可横屏并使用手机屏幕镜像。'); }
});
document.addEventListener('fullscreenchange', () => {
 fullscreen.textContent = document.fullscreenElement ? '退出全屏' : '全屏展示';
 if (!document.fullscreenElement) setControls(true);
});
// 常亮仅在浏览器支持且用户主动开启时申请；切后台释放后，回前台尝试恢复。
function updateAwakeButton() {
 $('awake').textContent = wakeLock ? '关闭屏幕常亮' : wantsAwake ? '常亮已暂停 · 重试' : '保持屏幕常亮';
 $('awake').setAttribute('aria-pressed', String(Boolean(wakeLock)));
}
async function acquireWakeLock(showFeedback) {
 if (wakePending || wakeLock || !wantsAwake || document.visibilityState !== 'visible') return;
 wakePending = true;
 $('awake').disabled = true;
 try {
  const lock = await navigator.wakeLock.request('screen');
  if (!wantsAwake || document.visibilityState !== 'visible') { await lock.release(); return; }
  wakeLock = lock;
  lock.addEventListener('release', () => {
   if (wakeLock === lock) wakeLock = null;
   updateAwakeButton();
  });
  if (showFeedback) tell('屏幕常亮已开启，请保持网页在前台。');
 } catch {
  if (showFeedback) tell('当前无法保持常亮，请在手机设置里暂时延长自动锁屏时间。');
 } finally {
  wakePending = false;
  $('awake').disabled = false;
  updateAwakeButton();
 }
}
$('awake').addEventListener('click', async () => {
 if (!navigator.wakeLock) {
  tell('此环境不支持网页常亮，请在手机设置里暂时延长自动锁屏时间。');
  return;
 }
 if (wakeLock) {
  wantsAwake = false;
  const lock = wakeLock;
  wakeLock = null;
  try { await lock.release(); } catch { /* 页面状态已复位。 */ }
  updateAwakeButton();
 } else {
  wantsAwake = true;
  await acquireWakeLock(true);
 }
});
document.addEventListener('visibilitychange', () => {
 if (document.visibilityState === 'visible') acquireWakeLock(false);
 else clearConfetti();
});
window.addEventListener('pagehide', () => {
 clearConfetti();
 const lock = wakeLock;
 wakeLock = null;
 if (lock) lock.release().catch(() => {});
});
window.addEventListener('pageshow', () => acquireWakeLock(false));
window.addEventListener('resize', clearConfetti);
if (reducedMotion.addEventListener) reducedMotion.addEventListener('change', clearConfetti);
document.addEventListener('keydown', event => {
 if (event.key === 'Escape') { setControls(true); $('farm').focus(); }
 if (event.key.toLowerCase() === 'h' && !event.repeat && !event.ctrlKey && !event.metaKey && !event.altKey) {
  setControls(controls.hidden);
  if (!controls.hidden) $('farm').focus();
 }
});
</script>
</body>
</html>
